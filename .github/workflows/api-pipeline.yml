# Optional: runs the pipeline through the Claude API instead of Claude Code.
# Needs an ANTHROPIC_API_KEY repo secret. Manual only; the default daily run is
# the Claude Code scheduled task described in DAILY_RUN.md.
name: Deals update (API key)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scout -> Verifier -> Publisher
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline.py

      # Pushes made with the default GITHUB_TOKEN don't trigger other workflows,
      # so deploy.yml is started explicitly afterwards.
      - name: Commit updated deals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "jelectronics-bot"
          git config user.email "jelectronics-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Daily deals update $(date -u +%F)"
          git push
          gh workflow run deploy.yml --ref main
